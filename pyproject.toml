[project]
name = "autotiktok"
version = "0.1.0"
description = "Publie automatiquement des vidéos sur TikTok, Instagram Reels et YouTube Shorts."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
