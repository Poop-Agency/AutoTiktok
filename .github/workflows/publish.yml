name: Publier une vidéo

# La publication tourne sur le serveur (crontab + scripts/run.sh). Ce workflow ne se lance qu'à la main.
# Pour publier depuis GitHub à la place du serveur, décommente le bloc schedule, mais jamais les deux
# en même temps, sinon chaque vidéo partirait deux fois.
on:
  # schedule:
  #   - cron: "47 10 * * *"
  #   - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation (n'envoie rien)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publier
        env:
          TOKENS_KEY: ${{ secrets.TOKENS_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python -m autotiktok publish-next ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Enregistrer l'état
        if: always() && !inputs.dry_run
        run: |
          git config user.name "autotiktok-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state input done 2>/dev/null || git add -A state input
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
            exit 0
          fi
          git commit -m "Publication automatique $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
