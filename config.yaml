# Réglages d'AutoTiktok. Tout est optionnel : les valeurs absentes prennent leur valeur par défaut.

# Plateformes sur lesquelles publier (true / false).
platforms:
  instagram: true
  tiktok: true
  youtube: true

# Légende utilisée quand une vidéo n'a pas de fichier .txt du même nom.
# Les hashtags sont ajoutés à la fin de chaque légende.
caption:
  default: "😂"
  hashtags: "#funny #humour #fyp"

instagram:
  share_to_feed: true        # le Reel apparaît aussi dans la grille du profil

tiktok:
  # draft  : la vidéo arrive dans tes brouillons TikTok, tu publies d'un tap (marche sans audit).
  # direct : publication directe. Avant l'audit TikTok, seul privacy_level SELF_ONLY est accepté.
  mode: draft
  privacy_level: PUBLIC_TO_EVERYONE   # PUBLIC_TO_EVERYONE | MUTUAL_FOLLOW_FRIENDS | FOLLOWER_OF_CREATOR | SELF_ONLY
  disable_comment: false
  disable_duet: false
  disable_stitch: false
  is_aigc: false

youtube:
  title: "{caption}"         # {caption} est remplacé par la légende ; #Shorts est ajouté automatiquement
  privacy: public            # public | unlisted | private (privé forcé par YouTube tant que l'audit n'est pas passé)
  category_id: "23"          # 23 = Humour
  made_for_kids: false
  tags: [funny, humour, shorts]

queue:
  input_dir: input
  done_dir: done
  order: random              # random : vidéo tirée au hasard ; alphabetical : par ordre de nom
  after_publish: delete      # delete : supprime la vidéo une fois publiée ; move : la déplace vers done/
  max_attempts: 3            # au bout de 3 échecs sur une plateforme, on passe à la vidéo suivante

# Compte sur lequel `post-next` publie (le compte « bestof »), par le site web d'Instagram.
upload:
  cookies_file: cookies_upload.txt # cookies (format Netscape) de CE compte, avec sessionid (jamais dans git)
  browser_path: ""                 # vide = Chromium installé par `playwright install chromium`
  headless: true                   # false : affiche le navigateur
  share_timeout: 240               # secondes d'attente maximum pour que le Reel apparaisse sur le profil

# Reels des comptes du pool (comptes à toi ou autorisés uniquement).
# `refresh-index` liste leurs Reels populaires, `post-next` en télécharge un et le publie.
fetch:
  pool_file: account_pools.txt     # un profil Instagram par ligne
  cookies_file: cookies_browse.txt # cookies (format Netscape) du compte Instagram jetable qui sert à lister (jamais dans git)
  index_file: state/index.json     # liste des Reels à plus de min_views vues
  min_views: 1000000
  max_reels_per_account: 0         # 0 = tous les Reels du compte
  request_delay: [3, 6]            # pause aléatoire (secondes) entre deux défilements de la page
  browser_path: ""                 # vide = Chromium installé par `playwright install chromium`
  headless: true                   # false : affiche le navigateur (utile pour comprendre un blocage)
